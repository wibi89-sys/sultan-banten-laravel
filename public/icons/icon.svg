<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="calcGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#1d4ed8"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Rounded Container -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="510" height="510" x="1" y="1" rx="111" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="2"/>

  <!-- Calculator Main Body -->
  <g filter="url(#shadow)">
    <rect x="110" y="85" width="292" height="342" rx="28" fill="url(#calcGrad)" stroke="#60a5fa" stroke-width="3"/>
  </g>

  <!-- Screen / Display -->
  <rect x="136" y="115" width="240" height="74" rx="14" fill="url(#screenGrad)" stroke="#334155" stroke-width="2"/>
  
  <!-- Screen LED Digits / Bars -->
  <rect x="156" y="142" width="45" height="18" rx="4" fill="#38bdf8" opacity="0.9"/>
  <rect x="211" y="142" width="35" height="18" rx="4" fill="#f59e0b" opacity="0.9"/>
  <rect x="256" y="136" width="100" height="30" rx="6" fill="#f59e0b"/>
  <text x="346" y="158" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="900" fill="#0f172a" text-anchor="end">20/10/26</text>

  <!-- Keypad Buttons Grid (4 rows x 3 cols) -->
  <!-- Row 1 -->
  <rect x="136" y="210" width="66" height="42" rx="10" fill="#ef4444"/>
  <text x="169" y="237" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">C</text>
  
  <rect x="223" y="210" width="66" height="42" rx="10" fill="#f8fafc"/>
  <text x="256" y="237" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">±</text>

  <rect x="310" y="210" width="66" height="42" rx="10" fill="#3b82f6"/>
  <text x="343" y="237" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">÷</text>

  <!-- Row 2 -->
  <rect x="136" y="264" width="66" height="42" rx="10" fill="#f8fafc"/>
  <text x="169" y="291" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">7</text>

  <rect x="223" y="264" width="66" height="42" rx="10" fill="#f8fafc"/>
  <text x="256" y="291" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">8</text>

  <rect x="310" y="264" width="66" height="42" rx="10" fill="#3b82f6"/>
  <text x="343" y="291" font-family="sans-serif" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">×</text>

  <!-- Row 3 -->
  <rect x="136" y="318" width="66" height="42" rx="10" fill="#f8fafc"/>
  <text x="169" y="345" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">4</text>

  <rect x="223" y="318" width="66" height="42" rx="10" fill="#f8fafc"/>
  <text x="256" y="345" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">5</text>

  <rect x="310" y="318" width="66" height="42" rx="10" fill="#3b82f6"/>
  <text x="343" y="345" font-family="sans-serif" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">−</text>

  <!-- Row 4 -->
  <rect x="136" y="372" width="66" height="42" rx="10" fill="#f8fafc"/>
  <text x="169" y="399" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">1</text>

  <rect x="223" y="372" width="66" height="42" rx="10" fill="#f8fafc"/>
  <text x="256" y="399" font-family="sans-serif" font-size="18" font-weight="bold" fill="#1e293b" text-anchor="middle">0</text>

  <rect x="310" y="372" width="66" height="42" rx="10" fill="#f59e0b"/>
  <text x="343" y="399" font-family="sans-serif" font-size="20" font-weight="bold" fill="#1e293b" text-anchor="middle">=</text>
</svg>
